name: "Test Dev Container Features"
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: "Install devcontainer CLI"
        run: npm install -g @devcontainers/cli

      # git-extended: base image ships git (the CLI does not resolve
      # dependsOn for local ./feature folders during tests).
      - name: "Test git-extended"
        run: devcontainer features test --features git-extended --base-image mcr.microsoft.com/devcontainers/base:ubuntu .

      # dotnet-tools: base image ships the .NET SDK the tools require.
      - name: "Test dotnet-tools"
        run: devcontainer features test --features dotnet-tools --base-image mcr.microsoft.com/devcontainers/dotnet:8.0 .
